pre-commit:
  jobs:
    - name: Check theme version and defs.ts version
      skip:
        # 仅在提交了theme.json的时候执行
        - run: test $(git diff --name-only --cached | grep -c 'theme\.json') -eq 0
      script: checkVersion.cjs
      runner: node
      fail_text: "请确保theme.json与defs.ts中版本号一致"
    - name: Format code
      glob:
        - "*.ts"
        - "*.scss"
        - "*.md"
        - "*.json"
      run: prettier -w {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: Conventional commit
      script: commitmsg.sh
      runner: bash
