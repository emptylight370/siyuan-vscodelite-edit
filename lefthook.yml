pre-commit:
  parallel: true
  jobs:
    - name: Check theme version and defs.ts version
      skip:
        # 仅在提交了theme.json的时候执行
        - run: test $(git diff --name-only --cached | grep -c 'theme\.json') -eq 0
      script: checkVersion.ts
      runner: node
      fail_text: "请确保theme.json与defs.ts中版本号一致"

    - name: Generate changelog
      skip:
        # 仅在提交了theme.json的时候执行
        - run: test $(git diff --name-only --cached | grep -c 'theme\.json') -eq 0
      run: |
        npm run changelog
        git add whatschange.md
      stage_fixed: true
      fail_text: "请检查依赖安装状态，运行mise install和npm install安装依赖"

    - name: Format code with prettier
      skip:
        # 在需要进行格式化时执行
        - run: git diff --name-only --cached | xargs npx prettier -c
      run: npx prettier -w {staged_files}
      stage_fixed: true
      fail_text: "请检查prettier安装状态，运行npm install安装依赖"

commit-msg:
  jobs:
    - name: Conventional commit
      script: commitmsg.sh
      runner: bash
