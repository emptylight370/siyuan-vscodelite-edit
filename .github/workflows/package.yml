name: package

on:
  push:
    paths: "theme.json"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Build scss
        run: npm run build

      - name: Package
        run: |
          find ./ -maxdepth 1 -type f \( -name 'theme.*' -o -name 'icon.png' -o -name 'preview.png' -o -name 'README*.md' \) > files.txt
          find ./ -path './resources/*' -o -path './sub/*.css' >> files.txt
          cat files.txt | zip -@ package.zip
          rm files.txt

      - name: Get current version
        uses: sergeysova/jq-action@v2
        id: version
        with:
          cmd: 'jq -r ".version" theme.json'

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          name: Release ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          make_latest: true
