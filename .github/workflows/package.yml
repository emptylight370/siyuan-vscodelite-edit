name: package

on:
  push:
    paths: 'theme.json'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions: 
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Install tool
        run: sudo apt-get install jq

      - name: Build scss
        run: npm run build

      - name: Package
        run: |
          find ./ -maxdepth 1 -type f \( -name 'theme.*' -o -name 'icon.png' -o -name 'preview.png' -o -name 'README*.md' \) > files.txt
          find ./ -path './resources/*' -o -path './sub/*' >> files.txt
          cat files.txt | zip -@ package.zip
          rm files.txt

      - name: Create tag
        run: echo "VERSION=$(jq -r ".version" theme.json)" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          name: Release ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          make_latest: true