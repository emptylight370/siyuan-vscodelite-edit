name: package

on:
  push:
    branches:
      - scss
    paths:
      - theme.json
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get current version
        uses: emptylight370/jq-action@v1
        id: version
        with:
          data: theme.json
          filter: .version

      - name: Skip if release exists
        uses: mukunku/release-exists-action@12f0514a28ffd4801e771c59e7b9c4f9a60428f2 # v1.1.0
        id: compare
        with:
          tag: ${{ steps.version.outputs.result }}

      - if: steps.compare.outputs.exists != 'true'
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Install deps
        if: steps.compare.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build scss
        if: steps.compare.outputs.exists != 'true'
        run: pnpm run build

      - name: Package
        if: steps.compare.outputs.exists != 'true'
        run: zip -r package.zip . -i 'theme.*' 'icon.png' 'preview.png' 'README*.md' 'resources/*' 'sub/*' -x '**/*.css.map' 'theme.css.map' 'theme.scss'

      - name: Generate release log
        if: steps.compare.outputs.exists != 'true'
        run: |
          git cliff -u -o release.md -t ${{ steps.version.outputs.result }}
          prettier -w release.md

      - name: Release
        if: steps.compare.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: package.zip
          name: Release ${{ steps.version.outputs.result }}
          tag_name: ${{ steps.version.outputs.result }}
          make_latest: true
          body_path: release.md
